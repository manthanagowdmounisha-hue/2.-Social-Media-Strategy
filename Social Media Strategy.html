<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Advertising Strategy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📱 Social Media Ad Strategy</h1>
        <p>One Product. Three Stories.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>🎯 Campaign Setup</h2>

            <label for="audience">Target Audience</label>
            <select id="audience">
                <option value="student">🎓 Students</option>
                <option value="fitness">🏃 Fitness Users</option>
                <option value="professional">💼 Working Professionals</option>
            </select>

            <label for="goal">Campaign Goal</label>
            <select id="goal">
                <option value="awareness">Brand Awareness</option>
                <option value="traffic">Website Traffic</option>
                <option value="sales">Product Sales</option>
                <option value="engagement">Engagement</option>
            </select>

            <label for="budget">Daily Budget (₹)</label>
            <input type="number" id="budget" value="500" min="100">

            <button onclick="generateStrategy()">
                Generate Strategy
            </button>
        </section>

        <section class="result card">
            <h2>📊 Recommended Strategy</h2>

            <div id="strategy">
                <p>Select your audience and campaign goal, then click
                    <strong>Generate Strategy</strong>.
                </p>
            </div>
        </section>

        <section class="card">
            <h2>📈 Engagement Calculator</h2>

            <label>Total Impressions</label>
            <input type="number" id="impressions" value="10000">

            <label>Likes</label>
            <input type="number" id="likes" value="700">

            <label>Comments</label>
            <input type="number" id="comments" value="100">

            <label>Shares</label>
            <input type="number" id="shares" value="50">

            <button onclick="calculateEngagement()">
                Calculate Engagement Rate
            </button>

            <div id="engagementResult"></div>
        </section>

    </main>

    <footer>
        <p>Advertising Project | Social Media Strategy</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
